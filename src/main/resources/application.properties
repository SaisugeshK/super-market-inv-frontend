spring.application.name=InventoryManagementSystem

# PostgreSQL Database Configuration
#spring.datasource.url=jdbc:postgresql://restaurant-db:5432/restaurant-service-db
spring.datasource.url=jdbc:postgresql://localhost:5433/inventorymanagementsystem-db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool — the Spring Boot default of 10 starves under concurrent
# load (checkout/report requests each hold a connection for the whole request,
# since open-in-view is on). Sized to comfortably clear a 50-user burst.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=15000

# JWT Configuration
jwt.secret=your-super-secret-jwt-key-change-this
jwt.expiration=604800000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.example.erp=DEBUG

spring.jpa.hibernate.ddl-auto=update
# SQL echo is a dev aid but serializes/floods logging under load — keep off.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.error.include-message=always
server.error.include-binding-errors=always
# Never expose stack traces / exception class names to API clients
server.error.include-stacktrace=never
server.error.include-exception=false

# Cash closing: |actual - expected| above this (per payment method) forces PENDING_APPROVAL
cash.closing.difference-threshold=100

# Bulk product import (CSV/XLSX) — plenty of headroom for a 500+ row spreadsheet
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
