spring.application.name=InventoryManagementSystem
server.port=${PORT:8090}

# PostgreSQL Database Configuration
# Local dev keeps working via the defaults after each colon;
# Cloud Run overrides these with real values via --set-env-vars / --set-secrets
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/inventorymanagementsystem-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

spring.datasource.driver-class-name=org.postgresql.Driver
# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-jwt-key-change-this}
jwt.expiration=604800000

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.example.erp=DEBUG

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
server.error.include-binding-errors=always
# Never expose stack traces / exception class names to API clients
server.error.include-stacktrace=never
server.error.include-exception=false

# Cash closing: |actual - expected| above this (per payment method) forces PENDING_APPROVAL
cash.closing.difference-threshold=100

# Pre-deployment fix — health check for Cloud Run (or any orchestrator) to know the container is
# alive. Only /actuator/health is exposed; everything else stays closed since those leak
# configuration/secret-adjacent details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
