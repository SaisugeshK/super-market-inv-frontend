# Production profile overrides. Activate with: --spring.profiles.active=production
# Schema is managed by migrations in production, never auto-mutated by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Do not leak internals to API clients.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=always
server.error.include-binding-errors=always

# JWT secret MUST be supplied via environment (JWT_SECRET), not committed.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}
